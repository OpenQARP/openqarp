{#- The wordmark with the site-wide burger menu beside it, the same menu the
    landing page and the blog carry: Home, GitHub, Docs, Blog. -#}
<div class="sidebar-brand-row">
  <button class="menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu" aria-label="Open menu">
    <svg class="ic-burger" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    <svg class="ic-close" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
  </button>
  <a class="sidebar-brand" href="{{ pathto(master_doc) }}">
    <span class="sidebar-brand-text">{{ docstitle if docstitle else project }}</span>
  </a>
</div>
<div class="site-menu" id="site-menu" hidden>
  <a href="https://openqarp.github.io/">Home</a>
  <a href="https://github.com/OpenQARP/openqarp">GitHub</a>
  <a href="{{ pathto(master_doc) }}" aria-current="page">Docs</a>
  <a href="https://blog.openqarp.com/">Blog</a>
</div>
