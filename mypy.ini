# qarpx is the compiled C++ backend: a .so built by scripts/bootstrap_qarpx.py
# and registered into the active interpreter via a .pth file.  mypy resolves
# third-party packages through site.getsitepackages(), which does not include
# directories added by .pth files, so mypy cannot find qarpx even when it is
# importable at runtime.  qarpx is an untyped C extension with no stubs, so
# treat it as Any rather than emitting import-not-found for every consumer.
#
# NOTE: `[mypy]` below is deliberately EMPTY — every setting is at its default,
# so unannotated function bodies are not checked at all.  That is a known gap,
# not an oversight, and it waits on qarpx type stubs: with stubs in place,
# 156 pre-existing errors across 49 files surface and need phasing.  Do not
# add strictness flags here piecemeal: turning them on one at a time buries
# that measurement and makes the backlog untrackable.
# The version pin and the CI job live in pyproject [dev] / [full-dev] and
# .github/workflows/ci.yml `mypy`.
[mypy]

[mypy-qarpx]
ignore_missing_imports = True

[mypy-qarpx.*]
ignore_missing_imports = True

# Optional third-party frameworks targeted by the emit/absorb integrations.
# Their tests guard imports with pytest.importorskip, but mypy still needs
# the modules resolvable; none of them are installed in the CI env (and
# qiskit/pytket/pennylane ship no stubs), so treat them as Any.
[mypy-qulacs.*]
ignore_missing_imports = True

[mypy-qiskit.*]
ignore_missing_imports = True

[mypy-pytket.*]
ignore_missing_imports = True

[mypy-pennylane.*]
ignore_missing_imports = True

# Benchmark-only comparison stacks, reached from `tests/` since
# tests/test_benchmarks imports benchmarks.statevector.  They live in the
# `bench` extra, which the CI mypy job does not install (it installs
# `full-dev`), so the same Any treatment applies.
[mypy-qiskit_aer.*]
ignore_missing_imports = True

[mypy-qsimcirq.*]
ignore_missing_imports = True

[mypy-ffsim.*]
ignore_missing_imports = True

[mypy-mqt.*]
ignore_missing_imports = True

[mypy-openfermionpyscf.*]
ignore_missing_imports = True
