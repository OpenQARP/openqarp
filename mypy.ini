# qarpx is read from the stub committed beside its bindings
# (cpp/libqarpx/python/qarpx.pyi).  An installed wheel carries it as
# qarpx-stubs, but a checkout's editable install holds the stub as it was at
# install time and the bootstrap scripts install none, so mypy_path points at
# the committed file; $MYPY_CONFIG_FILE_DIR resolves from any working directory.
#
# A strictness flag is switched on for a whole tree at once, and this note
# records what it surfaced, measured at ca09f06 with the stub on macOS, each
# flag on its own: on qarp/, check_untyped_defs took the errors from 65 to
# 221, and warn_unused_ignores found 55 unused ignores.  All were fixed when
# switched on.  tests/ keeps the defaults.
# The version pin and the CI job live in pyproject [dev] / [full-dev] and
# .github/workflows/ci.yml `mypy`.
[mypy]
mypy_path = $MYPY_CONFIG_FILE_DIR/cpp/libqarpx/python

[mypy-qarp,qarp.*]
check_untyped_defs = True
warn_unused_ignores = True

# Optional third-party frameworks targeted by the emit/absorb integrations.
# Their tests guard imports with pytest.importorskip, but mypy still needs
# the modules resolvable; none of them are installed in the CI env (and
# qiskit/pytket/pennylane ship no stubs), so treat them as Any.
[mypy-qulacs.*]
ignore_missing_imports = True

[mypy-qiskit.*]
ignore_missing_imports = True

[mypy-pytket.*]
ignore_missing_imports = True

[mypy-pennylane.*]
ignore_missing_imports = True

# Benchmark-only comparison stacks, reached from `tests/` since
# tests/test_benchmarks imports benchmarks.statevector.  They live in the
# `bench` extra, which the CI mypy job does not install (it installs
# `full-dev`), so the same Any treatment applies.
[mypy-qiskit_aer.*]
ignore_missing_imports = True

[mypy-qsimcirq.*]
ignore_missing_imports = True

[mypy-ffsim.*]
ignore_missing_imports = True

[mypy-mqt.*]
ignore_missing_imports = True

[mypy-openfermionpyscf.*]
ignore_missing_imports = True
