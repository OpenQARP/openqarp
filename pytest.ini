[pytest]
addopts =
    -m "not slow and not bench"
    # A typo'd @pytest.mark.<name> is otherwise a silent no-op: the mark is
    # recorded, matches no filter, and the test quietly runs unmarked forever.
    --strict-markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    bench: micro-benchmarks; excluded by default, run with '-m bench -s'
    property: Hypothesis property tests; run by default under the deterministic
        'gate' profile, explore with 'HYPOTHESIS_PROFILE=nightly pytest -m property'
testpaths = 
    tests
