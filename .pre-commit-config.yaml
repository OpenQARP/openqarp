# Pre-commit configuration for qarp.
#
# One-time setup (in your dev venv):
#     pip install pre-commit
#     pre-commit install
#
# After that, hooks fire automatically on every `git commit`.  To run all
# hooks across the whole repo without committing:
#     pre-commit run --all-files
#
# Pre-commit creates and caches its own isolated virtualenvs per hook, so
# the tool versions below are independent of whatever is in your active
# environment — no PATH plumbing needed.
#
# IMPORTANT: if any hook below fails, git aborts the commit — your changes
# are NOT recorded.  Fix the reported issues, re-stage with `git add`, and
# run `git commit` again.  The installed `.git/hooks/pre-commit` wrapper
# prints a banner reminding you of this whenever a check fails.

repos:
  # ruff is linter AND formatter; lint before format. Version must match
  # pyproject [dev] and .github/workflows/ci.yml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=500']
        # Vendored upstream trees are exempt: we ship them byte-identical, so
        # their file sizes are not ours to police (Eigen's lapacke.h is 1 MB).
        exclude: '^cpp/libqarpx/third_party/'

  - repo: local
    hooks:
      - id: forbidden-file-types
        name: Block forbidden file types (.pkl/.npy/.npz/.data/.csv/.json/.log)
        language: fail
        entry: >-
          Forbidden file type staged — your commit did NOT happen.
          Remove these files (or store them outside the repo), re-stage
          with `git add`, and run `git commit` again.
        files: '\.(pkl|npy|npz|data|csv|json|log)$'
        # Committed benchmark fixtures are the one sanctioned data location:
        # generated by data/generate_molecules.py, FCI-validated at write time.
        exclude: '^benchmarks/statevector/data/[a-z0-9_]+\.json$'
